services:
  db:
    image: postgres:17-alpine
    container_name: despensaviva_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dispensa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dispensa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: despensaviva_backend
    environment:
      PORT: 3007
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-dispensa}
      JWT_SECRET: ${JWT_SECRET:-troque_este_segredo_em_producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3007"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: despensaviva_web
    depends_on:
      - backend
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: despensaviva_caddy
    environment:
      DOMAIN: ${DOMAIN:-despensa.wikicode.com.br}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - backend
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-wikicode-despensa
    depends_on:
      - caddy
    environment:
      TUNNEL_TOKEN: eyJhIjoiNWM2ZWJlMGNiMTdkNGFlNjc3NTg1MzM3YmE3MjVjM2EiLCJ0IjoiYWZkY2NjYzYtODdkNC00N2Y4LTg0NTUtMmI4ZjQ2MDQ0OWUwIiwicyI6IlpUUTFOakJoT1RRdFlUSXlZUzAwTTJZeUxUa3hPVGd0TVdFelkySTNOR1U1TlRBeiJ9
    command: tunnel --no-autoupdate run
    network_mode: "service:caddy"
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
