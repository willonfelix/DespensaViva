server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Entrypoints que mudam a cada build (URL NÃO tem hash): nunca cachear.
    # Cache imutável aqui envenena navegador/CDN com build antigo.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        add_header Content-Type "application/javascript";
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/javascript";
    }

    location = /flutter.js {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/javascript";
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/javascript";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "no-cache";
    }

    location = /version.json {
        add_header Cache-Control "no-cache";
    }

    # Assets do Flutter versionados por hash -> cache longo imutável
    location ~* ^/assets/.*\.(?:js|wasm|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/canvaskit/.*\.(?:js|wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Demais rotas: SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }
}